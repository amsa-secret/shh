<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 8px solid #ff4d6d;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2.8rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .heart {
            color: #ff4d6d;
            font-size: 3rem;
            margin: 15px 0;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            5% { transform: scale(1.2); }
            10% { transform: scale(1.1); }
            15% { transform: scale(1.3); }
            50% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        .question {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            position: relative;
            min-height: 120px;
        }

        .btn {
            padding: 20px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            min-width: 180px;
            position: relative;
        }

        .btn-yes {
            background-color: #4CAF50;
            color: white;
        }

        .btn-yes:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .btn-no {
            background-color: #ff4d6d;
            color: white;
            position: absolute;
        }

        .btn-no:hover {
            background-color: #ff3355;
        }

        .message {
            font-size: 1.5rem;
            color: #333;
            margin-top: 20px;
            min-height: 40px;
            padding: 15px;
            font-weight: 600;
            transition: all 0.5s ease;
        }

        .hearts-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .small-heart {
            color: #ff4d6d;
            font-size: 1.5rem;
            opacity: 0;
            animation: floatUp 3s linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(20deg);
                opacity: 0;
            }
        }

        .final-message {
            font-size: 2.2rem;
            color: #ff4d6d;
            font-weight: bold;
            margin-top: 30px;
            padding: 20px;
            background-color: rgba(255, 77, 109, 0.1);
            border-radius: 20px;
            display: none;
        }

        .instructions {
            margin-top: 25px;
            font-size: 1.1rem;
            color: #666;
            font-style: italic;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .question {
                font-size: 1.5rem;
            }
            
            .btn {
                padding: 18px 30px;
                font-size: 1.5rem;
                min-width: 150px;
            }
            
            .buttons-container {
                gap: 20px;
                min-height: 110px;
            }
            
            .message {
                font-size: 1.3rem;
            }
            
            .final-message {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .question {
                font-size: 1.3rem;
            }
            
            .btn {
                padding: 15px 25px;
                font-size: 1.3rem;
                min-width: 130px;
            }
            
            .buttons-container {
                flex-direction: column;
                align-items: center;
                min-height: 200px;
            }
            
            .btn-no {
                position: relative;
                margin-top: 10px;
            }
        }

        /* Celebration animation */
        @keyframes celebrate {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .celebrate {
            animation: celebrate 0.5s ease 3;
        }
        
        /* Shake animation for the no button */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        
        .shake {
            animation: shake 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will You Be My Valentine?</h1>
        <div class="heart">
            <i class="fas fa-heart"></i>
        </div>
        <p class="question">I've been waiting for this moment to ask you... Will you make me the happiest person and be my Valentine?</p>
        
        <div class="buttons-container">
            <button class="btn btn-yes" id="yesBtn">YES!</button>
            <button class="btn btn-no" id="noBtn">NO</button>
        </div>
        
        <div class="message" id="message"></div>
        
        <div class="final-message" id="finalMessage">
            good girl.
        </div>
        
        <div class="hearts-container" id="heartsContainer"></div>
        
        <p class="instructions">Try clicking the NO button to see what happens... but we both know you'll click YES! ❤️</p>
    </div>

    <script>
        // Messages for the "no" button
        const noMessages = [
            "Are you sure?",
            "Why :(",
            "We can try again ☹️",
            "Please reconsider?",
            "I'll be really sad...",
            "But I made this for you!",
            "Think about it again?",
            "You're breaking my heart 💔",
            "Just give me a chance!",
            "Okay, last chance...",
            "Pretty please?",
            "I'll be the best Valentine!"
        ];
        
        let noClickCount = 0;
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const messageEl = document.getElementById('message');
        const finalMessageEl = document.getElementById('finalMessage');
        const heartsContainer = document.getElementById('heartsContainer');
        const buttonsContainer = document.querySelector('.buttons-container');
        
        // Handle clicks on the "no" button
        noBtn.addEventListener('click', function() {
            // Add shake animation
            noBtn.classList.add('shake');
            setTimeout(() => {
                noBtn.classList.remove('shake');
            }, 500);
            
            // Change the text of the button
            if (noClickCount < noMessages.length) {
                noBtn.textContent = noMessages[noClickCount];
                messageEl.textContent = noMessages[noClickCount];
                messageEl.style.color = "#ff4d6d";
                
                // Make the button smaller each time
                const currentSize = 1.8 - (noClickCount * 0.08);
                noBtn.style.fontSize = `${currentSize}rem`;
                
                // Move the button to a random position within the container
                const containerWidth = buttonsContainer.offsetWidth;
                const containerHeight = buttonsContainer.offsetHeight;
                const btnWidth = noBtn.offsetWidth;
                const btnHeight = noBtn.offsetHeight;
                
                // Calculate max positions to keep button fully visible
                const maxX = containerWidth - btnWidth - 20;
                const maxY = containerHeight - btnHeight - 20;
                
                // Only move if there's space to move
                if (maxX > 0 && maxY > 0) {
                    const randomX = Math.floor(Math.random() * maxX);
                    const randomY = Math.floor(Math.random() * maxY);
                    
                    noBtn.style.left = `${randomX}px`;
                    noBtn.style.top = `${randomY}px`;
                }
                
                noClickCount++;
                
                // Create floating hearts
                createHearts(3);
            }
            
            // If we've gone through all messages, change to a final message
            if (noClickCount >= noMessages.length) {
                noBtn.textContent = "Okay, I give up";
                noBtn.disabled = true;
                messageEl.textContent = "The NO button surrendered! Now click YES! ❤️";
                messageEl.style.color = "#4CAF50";
            }
        });
        
        // Handle clicks on the "yes" button
        yesBtn.addEventListener('click', function() {
            // Show celebration
            document.querySelector('.container').classList.add('celebrate');
            
            // Hide the buttons and message
            document.querySelector('.buttons-container').style.display = 'none';
            messageEl.style.display = 'none';
            document.querySelector('.instructions').style.display = 'none';
            
            // Show the final message exactly as "good girl."
            finalMessageEl.innerHTML = 'good girl.';
            finalMessageEl.style.display = 'block';
            
            // Create lots of hearts
            createHearts(25);
            
            // Change background to a celebration color
            document.body.style.background = "linear-gradient(135deg, #ffd6ff, #ffafbd)";
            
            // Play a celebration sound (if allowed by browser)
            playCelebrationSound();
        });
        
        // Function to create floating hearts
        function createHearts(count) {
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.classList.add('small-heart');
                heart.innerHTML = '<i class="fas fa-heart"></i>';
                
                // Random position
                const randomLeft = Math.floor(Math.random() * 90);
                heart.style.left = `${randomLeft}%`;
                
                // Random animation delay and duration
                const randomDelay = Math.random() * 0.5;
                const randomDuration = 2 + Math.random() * 2;
                
                heart.style.animationDelay = `${randomDelay}s`;
                heart.style.animationDuration = `${randomDuration}s`;
                
                heartsContainer.appendChild(heart);
                
                // Remove heart after animation completes
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }
        }
        
        // Function to play celebration sound
        function playCelebrationSound() {
            // Create a simple sound using the Web Audio API
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
                oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // G5
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (e) {
                // Audio context not supported, continue silently
                console.log("Audio not supported in this browser");
            }
        }
        
        // Make the "no" button move when hovered (for desktop) - but within container
        noBtn.addEventListener('mouseover', function() {
            if (window.innerWidth > 768 && noClickCount > 0 && !noBtn.disabled) {
                const containerWidth = buttonsContainer.offsetWidth;
                const containerHeight = buttonsContainer.offsetHeight;
                const btnWidth = noBtn.offsetWidth;
                const btnHeight = noBtn.offsetHeight;
                
                // Calculate max positions to keep button fully visible
                const maxX = containerWidth - btnWidth - 20;
                const maxY = containerHeight - btnHeight - 20;
                
                // Only move if there's space to move
                if (maxX > 0 && maxY > 0) {
                    const randomX = Math.floor(Math.random() * maxX);
                    const randomY = Math.floor(Math.random() * maxY);
                    
                    noBtn.style.left = `${randomX}px`;
                    noBtn.style.top = `${randomY}px`;
                }
                
                // Create a few hearts on hover
                if (noClickCount < noMessages.length) {
                    createHearts(1);
                }
            }
        });
    </script>
</body>
</html>
